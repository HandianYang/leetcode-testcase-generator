<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leetcode Testcase Generator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px 10px;
      background: #f5f5f5;
      min-height: 100vh;
    }

    .main-container {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin: 0 0 20px;
    }

    /* === Dropdown === */

    .dropdown-container {
      position: relative;
      margin-bottom: 20px;
      width: 100%;
    }

    .dropdown-selected {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background:	#000093;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      user-select: none;
      font-size: 1rem;
    }

    .dropdown-arrow {
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }

    .dropdown-selected.open .dropdown-arrow {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 5px 5px;
      list-style: none;
      padding: 0;
      margin: 0;
      z-index: 100;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .dropdown-item:hover {
      background: #f0f0f0;
    }

    .dropdown-item.active {
      background: #e8f0fe;
      color: #000093;
      font-weight: bold;
    }

    /* === Tab content === */

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .tab-content h2 {
      text-align: center;
      font-size: 1.2rem;
      margin: 0 0 8px;
    }

    .tab-description {
      text-align: center;
      color: #555;
      font-size: 0.9rem;
      margin: 0 0 16px;
    }

    /* === Form rows === */

    .form-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-row label {
      width: 150px;
      text-align: right;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .form-row input[type="number"] {
      width: 120px;
      flex-shrink: 0;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .form-row select {
      min-width: 120px;
      width: auto;
      flex-shrink: 0;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .btn-generate {
      display: block;
      margin: 16px auto 0;
      padding: 8px 28px;
      background:	#000093;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-generate:hover {
      background:	#000093;
    }

    /* === String tab checkboxes === */

    .checkbox-section-title {
      text-align: center;
      font-size: 0.95rem;
      margin: 8px 0 10px;
    }

    .checkbox-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .checkbox-row > label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 160px;
      font-size: 0.95rem;
    }

    .specify-input {
      display: none;
      width: 110px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    /* === Output === */

    .output-wrapper {
      position: relative;
      margin-top: 20px;
    }

    #output {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 12px;
      max-height: 180px;
      overflow: hidden;
      word-break: break-all;
      font-size: 0.9rem;
      background: #fafafa;
      min-height: 10px;
    }

    .output-wrapper.overflowing::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(transparent, #fafafa);
      border-radius: 0 0 5px 5px;
      pointer-events: none;
    }

    #copyButton {
      display: none;
      margin: 10px auto 0;
      padding: 6px 20px;
      background: #6c757d;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #copyButton:hover {
      background: #5a6268;
    }

    /* === Footer === */

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: #555;
    }

    .footer a {
      color: #007bff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* === Mobile === */

    @media (max-width: 480px) {
      .form-row {
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .form-row label {
        width: auto;
        text-align: center;
      }

      .form-row input[type="number"],
      .form-row select {
        width: 160px;
      }

      .checkbox-row {
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .checkbox-row > label {
        min-width: unset;
        justify-content: center;
      }

      .specify-input {
        width: 140px;
      }
    }
  </style>

  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

<div class="main-container">
  <h1>Leetcode Testcase Generator</h1>

  <!-- Dropdown navigation -->
  <div class="dropdown-container" id="dropdownContainer">
    <div class="dropdown-selected" id="dropdownSelected" onclick="toggleDropdown()">
      <span id="dropdownLabel">Numerical array</span>
      <span class="dropdown-arrow">&#9660;</span>
    </div>
    <ul class="dropdown-menu" id="dropdownMenu">
      <li class="dropdown-item active" onclick="selectTab('numerical-array-tab', this, 'Numerical array')">Numerical array</li>
      <li class="dropdown-item" onclick="selectTab('monotonic-numerical-array-tab', this, 'Monotonic numerical array')">Monotonic numerical array</li>
      <li class="dropdown-item" onclick="selectTab('string-tab', this, 'String')">String</li>
      <li class="dropdown-item" onclick="selectTab('numerical-matrix-tab', this, 'Numerical matrix')">Numerical matrix</li>
    </ul>
  </div>

  <!-- Tab: Numerical array -->
  <div id="numerical-array-tab" class="tab-content active">
    <form id="numerical-array-form" onsubmit="return false">
      <div class="form-row">
        <label for="numerical-array-lower-bound">Lower bound</label>
        <input type="number" id="numerical-array-lower-bound"
               name="numerical-array-lower-bound" value="0" required>
      </div>
      <div class="form-row">
        <label for="numerical-array-upper-bound">Upper bound</label>
        <input type="number" id="numerical-array-upper-bound"
               name="numerical-array-upper-bound" value="10" required>
      </div>
      <div class="form-row">
        <label for="numerical-array-length">Array length</label>
        <input type="number" id="numerical-array-length"
               name="numerical-array-length" value="10" required>
      </div>
      <button type="button" class="btn-generate" onclick="generateNumericalArray()">Generate</button>
    </form>
  </div>

  <!-- Tab: Monotonic numerical array -->
  <div id="monotonic-numerical-array-tab" class="tab-content">
    <form id="monotonic-numerical-array-form" onsubmit="return false">
      <div class="form-row">
        <label for="monotonic-numerical-array-lower-bound">Lower bound</label>
        <input type="number" id="monotonic-numerical-array-lower-bound"
               name="monotonic-numerical-array-lower-bound" value="0" required>
      </div>
      <div class="form-row">
        <label for="monotonic-numerical-array-upper-bound">Upper bound</label>
        <input type="number" id="monotonic-numerical-array-upper-bound"
               name="monotonic-numerical-array-upper-bound" value="10" required>
      </div>
      <div class="form-row">
        <label for="monotonic-numerical-array-length">Array length</label>
        <input type="number" id="monotonic-numerical-array-length"
               name="monotonic-numerical-array-length" value="10" required>
      </div>
      <div class="form-row">
        <label for="monotonic-numerical-array-type">Monotonic type</label>
        <select id="monotonic-numerical-array-type" name="monotonic-numerical-array-type">
          <option value="monotonic-numerical-array-type-non-decreasing">non-decreasing</option>
          <option value="monotonic-numerical-array-type-non-increasing">non-increasing</option>
          <option value="monotonic-numerical-array-type-strictly-increasing">strictly increasing</option>
          <option value="monotonic-numerical-array-type-strictly-decreasing">strictly decreasing</option>
        </select>
      </div>
      <button type="button" class="btn-generate" onclick="generateMonotonicNumericalArray()">Generate</button>
    </form>
  </div>

  <!-- Tab: String -->
  <div id="string-tab" class="tab-content">
    <form id="string-form" onsubmit="return false">
      <div class="form-row">
        <label for="string-length">Array length</label>
        <input type="number" id="string-length" name="string-length" value="10" required>
      </div>
      <p class="checkbox-section-title">The string may contain:</p>
      <div class="checkbox-row">
        <label><input type="checkbox" id="string-uppercase" name="string-uppercase"> uppercase letters</label>
        <input type="text" id="string-uppercase-input" class="specify-input"
               name="string-uppercase-input" placeholder="A-Z">
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" id="string-lowercase" name="string-lowercase"> lowercase letters</label>
        <input type="text" id="string-lowercase-input" class="specify-input"
               name="string-lowercase-input" placeholder="a-z">
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" id="string-number" name="string-number"> numbers</label>
        <input type="text" id="string-number-input" class="specify-input"
               name="string-number-input" placeholder="0-9">
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" id="string-symbol" name="string-symbol"> other symbols</label>
        <input type="text" id="string-symbol-input" class="specify-input"
               name="string-symbol-input" placeholder="Please specify...">
      </div>
      <button type="button" class="btn-generate" onclick="generateRandomString()">Generate</button>
    </form>
  </div>

  <!-- Tab: Numerical matrix -->
  <div id="numerical-matrix-tab" class="tab-content">
    <!-- <p class="tab-description">
      Generate an integer matrix of size \(M \times N\) with elements randomly drawn from \([\,\text{lower},\,\text{upper}\,]\).
    </p> -->
    <form id="numerical-matrix-form" onsubmit="return false">
      <div class="form-row">
        <label for="numerical-matrix-lower-bound">Lower bound</label>
        <input type="number" id="numerical-matrix-lower-bound"
               name="numerical-matrix-lower-bound" value="0" required>
      </div>
      <div class="form-row">
        <label for="numerical-matrix-upper-bound">Upper bound</label>
        <input type="number" id="numerical-matrix-upper-bound"
               name="numerical-matrix-upper-bound" value="10" required>
      </div>
      <div class="form-row">
        <label for="numerical-matrix-row">Number of rows</label>
        <input type="number" id="numerical-matrix-row"
               name="numerical-matrix-row" value="3" required>
      </div>
      <div class="form-row">
        <label for="numerical-matrix-col">Number of columns</label>
        <input type="number" id="numerical-matrix-col"
               name="numerical-matrix-col" value="3" required>
      </div>
      <button type="button" class="btn-generate" onclick="generateNumericalMatrix()">Generate</button>
    </form>
  </div>

  <!-- Output area -->
  <div class="output-wrapper" id="outputWrapper">
    <div id="output"></div>
  </div>
  <button onclick="copyOutput()" id="copyButton">Copy</button>

  <!-- Footer -->
  <p class="footer">
    If you like this project, please <a href="" target="_blank">&#9733; it on GitHub!</a>
  </p>
</div>

<script>

/* ===================== Dropdown ===================== */

function toggleDropdown() {
  const menu = document.getElementById('dropdownMenu');
  const selected = document.getElementById('dropdownSelected');
  const isOpen = menu.classList.contains('open');
  menu.classList.toggle('open', !isOpen);
  selected.classList.toggle('open', !isOpen);
}

function selectTab(tabId, item, label) {
  document.getElementById('dropdownLabel').textContent = label;
  document.getElementById('dropdownMenu').classList.remove('open');
  document.getElementById('dropdownSelected').classList.remove('open');
  document.querySelectorAll('.dropdown-item').forEach(function(el) {
    el.classList.remove('active');
  });
  item.classList.add('active');
  showTab(tabId);
}

document.addEventListener('click', function(e) {
  const container = document.getElementById('dropdownContainer');
  if (!container.contains(e.target)) {
    document.getElementById('dropdownMenu').classList.remove('open');
    document.getElementById('dropdownSelected').classList.remove('open');
  }
});

/* ===================== Tab switching ===================== */

function showTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(function(el) {
    el.classList.remove('active');
  });
  document.getElementById(tabId).classList.add('active');
}

/* ===================== Copy ===================== */

function copyOutput() {
  var outputText = document.getElementById("copyButton").getAttribute("output-text");
  navigator.clipboard.writeText(outputText).then(function() {
    alert("Output text copied to clipboard!");
  }, function() {
    alert("Unable to copy output text to clipboard.");
  });
}

/* ===================== Output overflow detection ===================== */

function checkOutputOverflow() {
  requestAnimationFrame(function() {
    const output = document.getElementById('output');
    const wrapper = document.getElementById('outputWrapper');
    wrapper.classList.toggle('overflowing', output.scrollHeight > output.clientHeight + 2);
  });
}

/* ===================== String checkboxes ===================== */

const stringUppercaseCheckbox = document.getElementById('string-uppercase');
const stringUppercaseInput = document.getElementById('string-uppercase-input');
stringUppercaseCheckbox.addEventListener('change', function() {
  stringUppercaseInput.style.display = this.checked ? 'inline-block' : 'none';
  if (!this.checked) stringUppercaseInput.value = '';
});

const stringLowercaseCheckbox = document.getElementById('string-lowercase');
const stringLowercaseInput = document.getElementById('string-lowercase-input');
stringLowercaseCheckbox.addEventListener('change', function() {
  stringLowercaseInput.style.display = this.checked ? 'inline-block' : 'none';
  if (!this.checked) stringLowercaseInput.value = '';
});

const stringNumberCheckbox = document.getElementById('string-number');
const stringNumberInput = document.getElementById('string-number-input');
stringNumberCheckbox.addEventListener('change', function() {
  stringNumberInput.style.display = this.checked ? 'inline-block' : 'none';
  if (!this.checked) stringNumberInput.value = '';
});

const stringSymbolCheckbox = document.getElementById('string-symbol');
const stringSymbolInput = document.getElementById('string-symbol-input');
stringSymbolCheckbox.addEventListener('change', function() {
  stringSymbolInput.style.display = this.checked ? 'inline-block' : 'none';
  if (!this.checked) stringSymbolInput.value = '';
});

/* ===================== Generators ===================== */

/**
 * @brief Generate a randomized numerical array in integer type. Each element
 *        in the array is randomly selected from a given numerical range.
 */
function generateNumericalArray() {
  var lowerBound = parseInt(document.getElementById("numerical-array-lower-bound").value);
  var upperBound = parseInt(document.getElementById("numerical-array-upper-bound").value);
  var length = parseInt(document.getElementById("numerical-array-length").value);

  // Exception: NaN inputs
  if (isNaN(lowerBound) || isNaN(upperBound) || isNaN(length)) {
    document.getElementById("output").innerHTML = "<p><b>Invalid inputs detected!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  // Exception: invalid value of length
  if (length < 0) {
    document.getElementById("output").innerHTML = "<p><b>The length must be a non-negative number!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  // Exception: invalid range
  if (lowerBound > upperBound) {
    document.getElementById("output").innerHTML = "<p><b>The lower bound must not be greater than the upper bound!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  var series = [];
  for (var i = 0; i < length; ++i) {
    series.push(Math.floor(Math.random() * (upperBound - lowerBound + 1)) + lowerBound);
  }

  var outputText = "[" + series.join(",") + "]";
  document.getElementById("output").innerHTML = "<p>" + outputText + "</p>";
  document.getElementById("copyButton").style.display = "block";
  document.getElementById("copyButton").setAttribute("output-text", outputText);
  checkOutputOverflow();
}

/**
 * @brief Generate a randomized numerical array in integer type, with elements
 *        listed in increasing/decreasing order. Each element in the array is
 *        randomly selected from a given numerical range.
 */
function generateMonotonicNumericalArray() {
  var lowerBound = parseInt(document.getElementById("monotonic-numerical-array-lower-bound").value);
  var upperBound = parseInt(document.getElementById("monotonic-numerical-array-upper-bound").value);
  var length = parseInt(document.getElementById("monotonic-numerical-array-length").value);
  var type = document.getElementById("monotonic-numerical-array-type").value;

  // Exception: NaN inputs
  if (isNaN(lowerBound) || isNaN(upperBound) || isNaN(length)) {
    document.getElementById("output").innerHTML = "<p><b>Invalid integers detected!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  // Exception: invalid value of length
  if (length < 0) {
    document.getElementById("output").innerHTML = "<p><b>The length must be a non-negative number!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  // Exception: invalid range
  if (lowerBound > upperBound) {
    document.getElementById("output").innerHTML = "<p><b>The lower bound must not be greater than the upper bound!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  var series = [];
  if (type == "monotonic-numerical-array-type-non-decreasing"
      || type == "monotonic-numerical-array-type-non-increasing") {
    for (var i = 0; i < length; ++i)
      series.push(Math.floor(Math.random() * (upperBound - lowerBound + 1)) + lowerBound);

    if (type == "monotonic-numerical-array-type-non-decreasing") {
      series.sort((a, b) => a - b);
    } else if (type == "monotonic-numerical-array-type-non-increasing") {
      series.sort((a, b) => b - a);
    }
  } else if (type == "monotonic-numerical-array-type-strictly-increasing"
      || type == "monotonic-numerical-array-type-strictly-decreasing") {
    // Exception: not enough numbers for strictly monotonic series
    if (upperBound - lowerBound + 1 < length) {
      document.getElementById("output").innerHTML = "<p><b>Not enough numbers for strictly monotonic series.</b></p>";
      document.getElementById("copyButton").style.display = "none";
      checkOutputOverflow();
      return;
    }

    // Construct a candidate pool for all numbers in [lowerBound, upperBound]
    var candidates = [];
    for (var i = lowerBound; i <= upperBound; ++i)
      candidates.push(i);

    // Select a number randomly, and remove it from the pool
    for (var i = 0; i < length; ++i) {
      var index = Math.floor(Math.random() * candidates.length);
      [candidates[index], candidates[candidates.length-1]] = [candidates[candidates.length-1], candidates[index]];
      series.push(candidates.pop());
    }

    if (type == "monotonic-numerical-array-type-strictly-increasing") {
      series.sort((a, b) => a - b);
    } else if (type == "monotonic-numerical-array-type-strictly-decreasing") {
      series.sort((a, b) => b - a);
    }
  }

  var outputText = "[" + series.join(",") + "]";
  document.getElementById("output").innerHTML = "<p>" + outputText + "</p>";
  document.getElementById("copyButton").style.display = "block";
  document.getElementById("copyButton").setAttribute("output-text", outputText);
  checkOutputOverflow();
}

/**
 * @brief Generate a randomized numerical matrix (i.e. 2D array) in integer type.
 *        Each element in the matrix is randomly selected from a given numerical range.
 */
function generateNumericalMatrix() {
  var lowerBound = parseInt(document.getElementById("numerical-matrix-lower-bound").value);
  var upperBound = parseInt(document.getElementById("numerical-matrix-upper-bound").value);
  var row = parseInt(document.getElementById("numerical-matrix-row").value);
  var col = parseInt(document.getElementById("numerical-matrix-col").value);

  // Exception: NaN inputs
  if (isNaN(lowerBound) || isNaN(upperBound) || isNaN(row) || isNaN(col)) {
    document.getElementById("output").innerHTML = "<p><b>Invalid integers detected!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  // Exception: invalid value of row or column
  if (row < 0 || col < 0) {
    document.getElementById("output").innerHTML = "<p><b>The number of rows and columns must be non-negative!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  // Exception: invalid range
  if (lowerBound > upperBound) {
    document.getElementById("output").innerHTML = "<p><b>The lower bound must not be greater than the upper bound!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  var matrix = [];
  for (var i = 0; i < row; ++i) {
    var series = [];
    for (var j = 0; j < col; ++j) {
      series.push(Math.floor(Math.random() * (upperBound - lowerBound + 1)) + lowerBound);
    }
    matrix.push(series);
  }

  var outputText = "[" + matrix.map(function(r) { return "[" + r.join(",") + "]"; }).join(",") + "]";
  document.getElementById("output").innerHTML = "<p>[" + matrix.map(function(r) { return "[" + r.join(",") + "]"; }).join(",<br>") + "]</p>";
  document.getElementById("copyButton").style.display = "block";
  document.getElementById("copyButton").setAttribute("output-text", outputText);
  checkOutputOverflow();
}

/**
 * @brief Generate a string of randomized characters. Each character is randomly
 *        selected from the given range and type, such as uppercase and lowercase
 *        letters, numbers, and other common symbols.
 */
function generateRandomString() {
  var candidates = "";

  // Append uppercase-letter candidates
  if (document.getElementById("string-uppercase").checked) {
    var uppercase = appendUppercase();
    if (uppercase == "") {
      document.getElementById("output").innerHTML = "<p><b>Invalid format of uppercase letters!</b></p>";
      document.getElementById("copyButton").style.display = "none";
      checkOutputOverflow();
      return;
    }
    candidates += uppercase;
  }

  // Append lowercase-letter candidates
  if (document.getElementById("string-lowercase").checked) {
    var lowercase = appendLowercase();
    if (lowercase == "") {
      document.getElementById("output").innerHTML = "<p><b>Invalid format of lowercase letters!</b></p>";
      document.getElementById("copyButton").style.display = "none";
      checkOutputOverflow();
      return;
    }
    candidates += lowercase;
  }

  // Append number candidates
  if (document.getElementById("string-number").checked) {
    var number = appendNumber();
    if (number == "") {
      document.getElementById("output").innerHTML = "<p><b>Invalid format of numbers!</b></p>";
      document.getElementById("copyButton").style.display = "none";
      checkOutputOverflow();
      return;
    }
    candidates += number;
  }

  // Append symbol candidates
  if (document.getElementById("string-symbol").checked) {
    candidates += document.getElementById("string-symbol-input").value;
  }

  candidates = removeDuplicateCharacters(candidates);

  // Exception: no selection of character types
  if (candidates.length == 0) {
    document.getElementById("output").innerHTML = "<p><b>No selection of character types! Please select at least one option.</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  var length = parseInt(document.getElementById("string-length").value);
  // Exception: invalid value of length
  if (isNaN(length) || length < 0) {
    document.getElementById("output").innerHTML = "<p><b>Invalid value of length detected!</b></p>";
    document.getElementById("copyButton").style.display = "none";
    checkOutputOverflow();
    return;
  }

  var outputString = "";
  for (var i = 0; i < length; ++i) {
    outputString += candidates[Math.floor(Math.random() * candidates.length)];
  }

  var outputText = "\"" + outputString + "\"";
  document.getElementById("output").innerHTML = "<p>" + outputText + "</p>";
  document.getElementById("copyButton").style.display = "block";
  document.getElementById("copyButton").setAttribute("output-text", outputText);
  checkOutputOverflow();
}

function appendUppercase() {
  return appendCandidates(
    "string-uppercase",
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    isUppercase
  );
}

function appendLowercase() {
  return appendCandidates(
    "string-lowercase",
    "abcdefghijklmnopqrstuvwxyz",
    isLowercase
  );
}

function appendNumber() {
  return appendCandidates(
    "string-number",
    "0123456789",
    isNumber
  );
}

function appendCandidates(type, pool, isType) {
  var range = document.getElementById(type + "-input").value;
  var candidates = "";
  switch (range.length) {
    case 0:
      // Format-1: Leave blank
      candidates = pool;
      break;
    case 1:
      // Format-2: X
      // Exception: invalid format (mismatch characters)
      if (!isType(range[0])) { return ""; }

      candidates = range[0];
      break;
    case 2:
      // Format-3: -X/X- and Format-4: XY/YX
      // Exception: invalid format (mismatch characters)
      if (!isType(range[0]) && !isType(range[1])) { return ""; }

      if (range[0] == '-') {
        // -X
        var upperIndex = range[1].charCodeAt() - pool[0].charCodeAt();
        candidates = pool.substring(0, upperIndex+1);
      } else if (range[1] == '-') {
        // X-
        var lowerIndex = range[0].charCodeAt() - pool[0].charCodeAt();
        candidates = pool.substring(lowerIndex);
      } else {
        // XY/YX
        if (range[0] <= range[1]) {
          candidates = pool.substring(
            range[0].charCodeAt()-pool[0].charCodeAt(),
            range[1].charCodeAt()-pool[0].charCodeAt()+1
          );
        } else {
          candidates = pool.substring(
            range[1].charCodeAt()-pool[0].charCodeAt(),
            range[0].charCodeAt()-pool[0].charCodeAt()+1
          );
        }
      }
      break;
    case 3:
      // Format-4: X-Y or Y-X
      // Exception: invalid format (irrelevant characters)
      if (range[1] != '-') { return ""; }
      // Exception: invalid format (mismatch characters)
      if (!isType(range[0]) || !isType(range[2])) { return ""; }

      if (range[0] <= range[2]) {
        candidates = pool.substring(
          range[0].charCodeAt()-pool[0].charCodeAt(),
          range[2].charCodeAt()-pool[0].charCodeAt()+1
        );
      } else {
        candidates = pool.substring(
          range[2].charCodeAt()-pool[0].charCodeAt(),
          range[0].charCodeAt()-pool[0].charCodeAt()+1
        );
      }
      break;
  }
  return candidates;
}

const isUppercase = (ch) => ch >= 'A' && ch <= 'Z';
const isLowercase = (ch) => ch >= 'a' && ch <= 'z';
const isNumber = (ch) => ch >= '0' && ch <= '9';

/**
 * @brief Remove all duplicated characters in a string
 */
function removeDuplicateCharacters(str) {
  // Convert string to an array, use Set to remove duplicates, then join back to a string
  return [...new Set(str)].join('');
}
